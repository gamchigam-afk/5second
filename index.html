<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>5초 준다! - 2 Player</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% 0%,#293142 0%,#0b0e15 48%,#05070b 100%);
    color:#fff;
    font-family:Arial,"Noto Sans KR",sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

.app{
    width:min(94vw,680px);
    padding:20px 0 30px;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.logo{
    font-size:21px;
    font-weight:900;
}

.logo span{
    color:#ffb52e;
}

.mode{
    font-size:10px;
    letter-spacing:2px;
    color:#727c8f;
}

/* PLAYERS */

.players{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:16px;
}

.player{
    padding:15px 12px;
    border-radius:17px;
    background:rgba(18,23,32,.9);
    border:1px solid rgba(255,255,255,.07);
    text-align:center;
    transition:.25s;
}

.player.active{
    border-color:#ffb52e;
    background:rgba(255,181,46,.07);
    box-shadow:
        0 0 25px rgba(255,181,46,.12),
        inset 0 0 20px rgba(255,181,46,.03);
}

.player-name{
    font-size:11px;
    font-weight:800;
    letter-spacing:2px;
    color:#7d8799;
    margin-bottom:5px;
}

.player.active .player-name{
    color:#ffb52e;
}

.player-score{
    font-size:30px;
    font-weight:900;
}

/* CARD */

.card{
    position:relative;
    min-height:590px;
    padding:27px;
    border-radius:28px;
    background:
        linear-gradient(145deg,#1d2330,#0d1119);
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 30px 80px rgba(0,0,0,.5);
    text-align:center;
    overflow:hidden;
}

.card::before{
    content:"";
    position:absolute;
    width:280px;
    height:280px;
    left:50%;
    top:-170px;
    transform:translateX(-50%);
    border-radius:50%;
    background:rgba(255,181,46,.08);
    filter:blur(70px);
}

/* TURN */

.turn{
    position:relative;
    font-size:11px;
    color:#ffb52e;
    letter-spacing:2px;
    font-weight:bold;
    margin-bottom:15px;
}

/* QUESTION */

.question{
    position:relative;
    min-height:85px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:clamp(24px,6vw,35px);
    line-height:1.25;
    font-weight:900;
    letter-spacing:-1px;
    word-break:keep-all;
}

/*
   시작 전에는 완전히 빈 공간.
   글자도 없고, 배경도 없음.
*/

.question.hidden{
    color:transparent;
    font-size:0;
}

/* TIMER */

.timer-wrap{
    width:220px;
    height:220px;
    margin:23px auto;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

.ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    padding:5px;

    background:
        conic-gradient(
            #ffb52e var(--progress,0deg),
            rgba(255,255,255,.05) var(--progress,0deg)
        );
}

.ring::after{
    content:"";
    position:absolute;
    inset:5px;
    border-radius:50%;
    background:#10141c;
}

.timer{
    position:relative;
    z-index:2;
    font-size:66px;
    font-weight:900;
    font-variant-numeric:tabular-nums;
    letter-spacing:-3px;
}

.unit{
    position:absolute;
    z-index:3;
    bottom:47px;
    color:#687285;
    font-size:9px;
    letter-spacing:3px;
}

/* BUTTON */

.controls{
    position:relative;
    display:flex;
    justify-content:center;
}

button{
    border:0;
    cursor:pointer;
    color:#fff;
    font-family:inherit;
    font-weight:800;
    transition:.15s;
}

button:active{
    transform:scale(.96);
}

.start{
    width:230px;
    height:54px;
    border-radius:15px;
    background:
        linear-gradient(135deg,#ffb52e,#ff7d20);
    box-shadow:
        0 10px 30px rgba(255,150,40,.2);
}

.start:hover{
    filter:brightness(1.1);
    transform:translateY(-2px);
}

/* RESULT */

.result{
    display:none;
    margin-top:18px;
}

.result.show{
    display:block;
}

.result p{
    color:#8d96a7;
    font-size:12px;
    margin-bottom:12px;
}

.result-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
}

.result button{
    height:47px;
    border-radius:13px;
    padding:0 27px;
}

.success{
    background:#46d89b;
    color:#06150e;
}

.fail{
    background:rgba(255,80,95,.12);
    border:1px solid rgba(255,80,95,.3);
    color:#ff737e;
}

/* NEXT */

.next{
    margin-top:14px;
    height:48px;
    padding:0 35px;
    border-radius:13px;
    background:#252c39;
    display:none;
}

.next.show{
    display:inline-block;
}

.help{
    margin-top:15px;
    text-align:center;
    color:#596376;
    font-size:10px;
}

/* COUNTDOWN */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(4,6,10,.86);
    backdrop-filter:blur(12px);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:100;
}

.overlay.show{
    display:flex;
}

.count{
    font-size:150px;
    font-weight:1000;
    color:#ffb52e;
    text-shadow:
        0 0 50px rgba(255,181,46,.5);
}

/* END */

.end{
    position:fixed;
    inset:0;
    background:rgba(4,6,10,.86);
    backdrop-filter:blur(15px);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:200;
    padding:20px;
}

.end.show{
    display:flex;
}

.endbox{
    width:min(90vw,430px);
    padding:38px 25px;
    text-align:center;
    border-radius:27px;
    background:#151a24;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 30px 100px rgba(0,0,0,.6);
}

.trophy{
    font-size:58px;
    margin-bottom:12px;
}

.endbox h1{
    font-size:31px;
    margin-bottom:10px;
}

.endbox p{
    color:#8b94a5;
    line-height:1.7;
    margin-bottom:23px;
}

.restart{
    width:100%;
    height:52px;
    border-radius:14px;
    background:
        linear-gradient(135deg,#ffb52e,#ff7d20);
}

/* EFFECTS */

.shake{
    animation:shake .35s;
}

@keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-8px)}
    40%{transform:translateX(8px)}
    60%{transform:translateX(-6px)}
    80%{transform:translateX(6px)}
}

.flash{
    animation:flash .5s ease;
}

@keyframes flash{
    50%{
        box-shadow:
            0 0 0 3px rgba(70,216,155,.4),
            0 0 80px rgba(70,216,155,.25);
    }
}

@media(max-width:500px){

    .app{
        width:94vw;
    }

    .card{

        padding:20px;

    }

    }

    .unit{
        bottom:41px;
    }

    .question{
        font-size:25px;
    }

    .player-score{
        font-size:26px;
    }
}
</style>

/* =========================================
   소리
========================================= */

const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

let audioCtx = null;

function sound(freq=700,duration=.12){

    if(!AudioContext) return;

    if(!audioCtx)
        audioCtx = new AudioContext();

    if(audioCtx.state === "suspended")
        audioCtx.resume();

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.frequency.value = freq;

    osc.type = "sine";

    gain.gain.setValueAtTime(
        .001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .22,
        audioCtx.currentTime+.01
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+duration
    );

    osc.connect(gain);

    gain.connect(audioCtx.destination);

    osc.start();

    osc.stop(
        audioCtx.currentTime+duration
    );
}

   플레이어 표시

    score1.textContent = scores[0];

    if(currentPlayer === 0){

        player1Box.classList.add("active");

        player2Box.classList.remove("active");

        turnEl.textContent =

}


/* =========================================

========================================= */

function prepareQuestion(){

    if(questionUsed.length >= questions.length){

        questionUsed = [];
    }

    let index;

    do{

        index =
            Math.floor(
                Math.random()*questions.length
            );

    }while(
        questionUsed.includes(index)
    );

    questionUsed.push(index);

    return questions[index];
}

   시작
========================================= */

        startBtn.style.display = "none";

        countdown.classList.add("show");

        let n = 3;

        countNumber.textContent = n;

        sound(600,.1);

        const interval =
            setInterval(()=>{

                n--;

                if(n > 0){

                    countNumber.textContent = n;

                    sound(
                        n === 1 ? 900 : 650,
                        .1
                    );

                    clearInterval(interval);

                    countdown.classList.remove(
                        "show"
                    );

                    /*

                        여기서 처음으로 문제를 생성한다.

                }

            },800);
    }
);


/* =========================================
   타이머
========================================= */

function startTimer(){

    running = true;

    timerStart =
        performance.now();

    timerEl.textContent = "5.00";

    ring.style.setProperty(
        "--progress",
        "0deg"
    );

    animationFrame =
        requestAnimationFrame(
            updateTimer
        );
}


function updateTimer(now){

    if(!running) return;

    const elapsed =
        (now - timerStart) / 1000;

    const remaining =
        Math.max(0,5-elapsed);

    timerEl.textContent =
        remaining.toFixed(2);

    const progress =
        (elapsed / 5) * 360;

    ring.style.setProperty(
        "--progress",
        `${progress}deg`
    );

    if(elapsed >= 5){

        finishTimer();

        return;
    }

    animationFrame =
        requestAnimationFrame(
            updateTimer
        );
}


/* =========================================
   종료
========================================= */

function finishTimer(){

    running = false;

    cancelAnimationFrame(
        animationFrame
    );

    timerEl.textContent =
        "0.00";

    ring.style.setProperty(
        "--progress",
        "360deg"
    );

    sound(950,.18);

    setTimeout(()=>{
        sound(650,.15);
    },180);

    result.classList.add("show");
}


/* =========================================
   성공
========================================= */

successBtn.addEventListener(
    "click",
    ()=>{

        scores[currentPlayer]++;

        updatePlayers();

        card.classList.remove("shake");

        void card.offsetWidth;

        card.classList.add("flash");

        sound(1100,.15);

        result.classList.remove("show");

        nextBtn.classList.add("show");

        if(scores[currentPlayer] >= 10){

            setTimeout(
                endGame,
                400
            );
        }
    }
);


/* =========================================
   실패
========================================= */

failBtn.addEventListener(
    "click",
    ()=>{

        card.classList.remove("flash");

        void card.offsetWidth;

        card.classList.add("shake");

        sound(250,.2);

        result.classList.remove("show");

        nextBtn.classList.add("show");
    }
);


/* =========================================
   다음 문제
========================================= */

nextBtn.addEventListener(
    "click",
    ()=>{

        currentPlayer =
            currentPlayer === 0
            ? 1
            : 0;

        updatePlayers();

        /*
            문제 즉시 삭제
        */

        questionEl.textContent = "";

        questionEl.classList.add(
            "hidden"
        );

        timerEl.textContent = "5.00";

        ring.style.setProperty(
            "--progress",
            "0deg"
        );

        startBtn.style.display =
            "inline-block";

        nextBtn.classList.remove(
            "show"
        );

        card.classList.remove(
            "flash",
            "shake"
        );
    }
);


/* =========================================
   게임 종료
========================================= */

function endGame(){

    const s1 = scores[0];

    const s2 = scores[1];

    if(s1 > s2){

        winner.textContent =
            "🏆 PLAYER 1 승리!";

    }else if(s2 > s1){

        winner.textContent =
            "🏆 PLAYER 2 승리!";

    }else{

        winner.textContent =
            "🤝 무승부!";
    }

    finalScore.innerHTML =
        `PLAYER 1　<b>${s1}</b>점<br>
         PLAYER 2　<b>${s2}</b>점`;

    end.classList.add("show");

    sound(1200,.2);

    setTimeout(()=>{
        sound(1500,.25);
    },220);
}


/* =========================================
   다시 시작
========================================= */

restartBtn.addEventListener(
    "click",
    ()=>{

        scores = [0,0];

        currentPlayer = 0;

        questionUsed = [];

        end.classList.remove(
            "show"
        );

        updatePlayers();

        /*
            시작 화면으로 복귀
        */

        questionEl.textContent = "";

        questionEl.classList.add(
            "hidden"
        );

        timerEl.textContent =
            "5.00";

        ring.style.setProperty(
            "--progress",
            "0deg"
        );

        startBtn.style.display =
            "inline-block";

        result.classList.remove(
            "show"
        );

        nextBtn.classList.remove(
            "show"
        );
    }
);


/* =========================================
   초기 상태
========================================= */

updatePlayers();

questionEl.textContent = "";

questionEl.classList.add(
    "hidden"
);

timerEl.textContent = "5.00";

ring.style.setProperty(
    "--progress",
    "0deg"
);

</script>
