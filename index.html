<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5초 준다! - 2 PLAYER</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,"Noto Sans KR",sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -10%,#27345e 0%,#11162b 38%,#070a13 100%);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow-x:hidden;
}

.game{
  width:min(820px,94vw);
  padding:24px 0 40px;
}

.header{
  text-align:center;
  margin-bottom:18px;
}

.header h1{
  font-size:clamp(30px,6vw,52px);
  font-weight:900;
  letter-spacing:-2px;
}

.header p{
  margin-top:7px;
  color:#9ca8c7;
  font-size:14px;
}

/* PLAYER */

.players{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:14px;
}

.player{
  background:rgba(20,27,48,.82);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:14px 17px;
  transition:.25s;
  position:relative;
  overflow:hidden;
}

.player.active{
  border-color:#72a7ff;
  box-shadow:
    0 0 25px rgba(77,140,255,.25),
    inset 0 0 20px rgba(77,140,255,.06);
  transform:translateY(-2px);
}

.player.active::before{
  content:"CURRENT";
  position:absolute;
  top:8px;
  right:10px;
  font-size:9px;
  font-weight:900;
  color:#78aaff;
  letter-spacing:1px;
}

.player-name{
  color:#aeb9d5;
  font-size:12px;
  font-weight:bold;
}

.player-score{
  font-size:30px;
  font-weight:900;
  margin-top:2px;
}

.player-bottom{
  display:flex;
  justify-content:space-between;
  color:#7e8aa8;
  font-size:11px;
  margin-top:4px;
}

/* ROUND */

.round-info{
  text-align:center;
  margin-bottom:13px;
}

.round{
  font-weight:900;
  font-size:14px;
  color:#aeb9d5;
}

.turn{
  margin-top:5px;
  font-size:20px;
  font-weight:900;
  color:#79aaff;
}

/* CARD */

.card{
  background:rgba(15,20,36,.88);
  border:1px solid rgba(255,255,255,.08);
  border-radius:28px;
  padding:28px 22px 24px;
  box-shadow:0 20px 70px rgba(0,0,0,.35);
  position:relative;
  overflow:hidden;
}

.question-area{
  min-height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:10px;
}

.question{
  font-size:clamp(23px,5vw,37px);
  font-weight:900;
  line-height:1.35;
  letter-spacing:-1px;
}

.question.hidden{
  visibility:hidden;
}

/* EVENT */

.event-area{
  text-align:center;
  height:34px;
}

.event{
  display:inline-flex;
  min-height:28px;
  align-items:center;
  justify-content:center;
  padding:5px 13px;
  border-radius:999px;
  background:rgba(255,255,255,.07);
  color:#bac5df;
  font-size:12px;
  font-weight:800;
  margin:5px auto 16px;
}

.event.hot{
  background:rgba(255,94,94,.13);
  color:#ff8c8c;
}

.event.good{
  background:rgba(79,210,141,.13);
  color:#6ee7a5;
}

/* TIMER */

.timer-wrap{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:8px 0 22px;
}

.ring{
  width:190px;
  height:190px;
  border-radius:50%;
  background:conic-gradient(#72a7ff 360deg,#202945 0deg);
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

.ring::before{
  content:"";
  position:absolute;
  width:164px;
  height:164px;
  border-radius:50%;
  background:#10162a;
}

.timer{
  position:relative;
  z-index:2;
  font-size:47px;
  font-weight:900;
  font-variant-numeric:tabular-nums;
}

.timer.warning{
  color:#ff6464;
  animation:warning .35s infinite alternate;
}

@keyframes warning{
  from{transform:scale(1);}
  to{transform:scale(1.09);}
}

/* BUTTON */

.main-btn{
  width:100%;
  border:0;
  border-radius:15px;
  padding:16px;
  background:linear-gradient(135deg,#548dff,#7a63ff);
  color:white;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  transition:.2s;
  box-shadow:0 8px 25px rgba(80,120,255,.22);
}

.main-btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.08);
}

.main-btn:active{
  transform:scale(.98);
}

.main-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none;
}

/* RESULT BUTTONS */

.result-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:11px;
}

.result-btn{
  border:0;
  border-radius:15px;
  padding:16px 10px;
  color:#fff;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  transition:.2s;
}

.result-btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.08);
}

.result-btn:active{
  transform:scale(.97);
}

.success-btn{
  background:linear-gradient(135deg,#20b978,#35d894);
  box-shadow:0 8px 25px rgba(50,220,150,.18);
}

.fail-btn{
  background:linear-gradient(135deg,#e34e60,#ff6877);
  box-shadow:0 8px 25px rgba(255,80,100,.18);
}

.result-buttons.hidden{
  display:none;
}

/* DIFFICULTY */

.difficulty{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:11px;
}

.diff-btn{
  padding:11px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.08);
  background:#171e34;
  color:#9ba7c4;
  cursor:pointer;
  font-weight:800;
}

.diff-btn.active{
  background:#273c70;
  color:#fff;
  border-color:#5f8fff;
}

.diff-btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

/* STATUS */

.status{
  text-align:center;
  margin-top:13px;
  color:#707c9a;
  font-size:12px;
}

/* COUNTDOWN */

.countdown{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(3,5,12,.78);
  backdrop-filter:blur(12px);
  display:none;
  justify-content:center;
  align-items:center;
}

.countdown.show{
  display:flex;
}

.count-number{
  font-size:clamp(100px,25vw,220px);
  font-weight:1000;
  color:#fff;
  text-shadow:0 0 60px rgba(100,150,255,.7);
  animation:countPop .85s ease;
}

@keyframes countPop{
  0%{
    transform:scale(1.7);
    opacity:0;
  }
  35%{
    opacity:1;
  }
  100%{
    transform:scale(1);
    opacity:1;
  }
}

/* ANNOUNCE */

.announce{
  position:fixed;
  inset:0;
  z-index:110;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(2,4,10,.7);
  backdrop-filter:blur(7px);
}

.announce.show{
  display:flex;
}

.announce-text{
  font-size:clamp(48px,12vw,120px);
  font-weight:1000;
  text-align:center;
  animation:announcePop .45s ease;
  text-shadow:0 0 50px rgba(255,255,255,.25);
}

@keyframes announcePop{
  0%{
    transform:scale(.45);
    opacity:0;
  }

  70%{
    transform:scale(1.08);
  }

  100%{
    transform:scale(1);
    opacity:1;
  }
}

/* EFFECTS */

.flash{
  animation:flash .4s ease;
}

@keyframes flash{
  0%{
    box-shadow:0 0 0 rgba(90,255,170,0);
  }

  50%{
    box-shadow:0 0 80px rgba(90,255,170,.55);
  }

  100%{
    box-shadow:0 0 0 rgba(90,255,170,0);
  }
}

.shake{
  animation:shake .42s ease;
}

@keyframes shake{
  0%,100%{
    transform:translateX(0);
  }

  20%{
    transform:translateX(-10px);
  }

  40%{
    transform:translateX(10px);
  }

  60%{
    transform:translateX(-7px);
  }

  80%{
    transform:translateX(7px);
  }
}

/* PARTICLES */

.particles{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:120;
}

.particle{
  position:absolute;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#76a7ff;
  animation:particle .8s ease-out forwards;
}

@keyframes particle{
  from{
    transform:translate(0,0) scale(1);
    opacity:1;
  }

  to{
    transform:translate(var(--x),var(--y)) scale(0);
    opacity:0;
  }
}

/* END */

.end{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(3,5,12,.88);
  backdrop-filter:blur(15px);
  padding:20px;
}

.end.show{
  display:flex;
}

.end-box{
  width:min(700px,94vw);
  max-height:90vh;
  overflow:auto;
  background:#10162a;
  border:1px solid rgba(255,255,255,.1);
  border-radius:28px;
  padding:28px;
  box-shadow:0 25px 100px rgba(0,0,0,.55);
}

.end-title{
  text-align:center;
  font-size:35px;
  font-weight:1000;
  margin-bottom:5px;
}

.end-sub{
  text-align:center;
  color:#8d99b7;
  font-size:13px;
  margin-bottom:24px;
}

.final-players{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.final-player{
  background:#171e34;
  border-radius:18px;
  padding:18px;
}

.final-player h3{
  color:#aeb9d5;
  font-size:14px;
  margin-bottom:6px;
}

.final-score{
  font-size:36px;
  font-weight:1000;
  margin-bottom:13px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.stat{
  background:rgba(255,255,255,.04);
  border-radius:11px;
  padding:10px;
}

.stat-label{
  color:#7885a3;
  font-size:10px;
}

.stat-value{
  margin-top:3px;
  font-weight:900;
  font-size:15px;
}

.result-message{
  text-align:center;
  margin:20px 0;
  font-size:22px;
  font-weight:900;
}

@media(max-width:600px){

  .game{
    padding-top:14px;
  }

  .card{
    padding:20px 15px;
    border-radius:22px;
  }

  .ring{
    width:165px;
    height:165px;
  }

  .ring::before{
    width:143px;
    height:143px;
  }

  .timer{
    font-size:40px;
  }

  .final-players{
    grid-template-columns:1fr;
  }

}
</style>
</head>

</div>

/* =========================
   GAME STATE
========================= */

let currentRound = 0;
let currentPlayer = 0;

let scores = [0,0];
let combos = [0,0];
let bestCombos = [0,0];

let successCounts = [0,0];
let failCounts = [0,0];

let totalTimes = [0,0];

let selectedDifficulty = "easy";

let running = false;
let waitingForResult = false;

let timerStart = 0;
let animationFrame = null;

let currentLimit = 5;
let currentEvent = null;
let currentQuestion = "";

let usedQuestions = new Set();


/* =========================
   ELEMENTS
========================= */

const questionEl =
  document.getElementById("question");

const timerEl =
  document.getElementById("timer");

const ringEl =
  document.getElementById("ring");

const startBtn =
  document.getElementById("startBtn");

const successBtn =
  document.getElementById("successBtn");

const failBtn =
  document.getElementById("failBtn");

const resultButtons =
  document.getElementById("resultButtons");

const eventText =
  document.getElementById("eventText");

const statusEl =
  document.getElementById("status");

const countdownEl =
  document.getElementById("countdown");

const countNumber =
  document.getElementById("countNumber");

const announceEl =
  document.getElementById("announce");

const announceText =
  document.getElementById("announceText");

const gameCard =
  document.getElementById("gameCard");

const roundText =
  document.getElementById("roundText");

const turnText =
  document.getElementById("turnText");

const playerCards = [

  document.getElementById("playerCard0"),

  document.getElementById("playerCard1")

];


/* =========================
   DIFFICULTY
========================= */

document
.querySelectorAll(".diff-btn")
.forEach(btn => {

  btn.addEventListener("click", () => {

    if(running || waitingForResult) return;

    selectedDifficulty =
      btn.dataset.diff;

    document
      .querySelectorAll(".diff-btn")
      .forEach(b =>
        b.classList.remove("active")
      );

    btn.classList.add("active");

    statusEl.textContent =
      selectedDifficulty.toUpperCase() +
      " 난이도가 선택되었습니다.";

  });

});


/* =========================
   QUESTION RANGE
========================= */

function getDifficultyRange(diff){

  if(diff === "easy"){
    return [0,29];
  }

  if(diff === "normal"){
    return [30,69];
  }

  return [70,99];

}


/* =========================
   GET QUESTION
========================= */

function getQuestion(){

  let difficulty =
    selectedDifficulty;

  if(
    currentEvent &&
    currentEvent.type === "random"
  ){

    const list = [
      "easy",
      "normal",
      "hard"
    ];

    difficulty =
      list[
        Math.floor(
          Math.random()*list.length
        )
      ];

  }

  const range =
    getDifficultyRange(difficulty);

  let candidates = [];

  for(
    let i=range[0];
    i<=range[1];
    i++
  ){

    if(!usedQuestions.has(i)){
      candidates.push(i);
    }

  }

  /*
    해당 난이도가 전부 사용됐다면
    남은 문제 중에서 선택
  */

  if(candidates.length === 0){

    for(
      let i=0;
      i<questions.length;
      i++
    ){

      if(!usedQuestions.has(i)){
        candidates.push(i);
      }

    }

  }

  if(candidates.length === 0){
    return null;
  }

  const index =
    candidates[
      Math.floor(
        Math.random()*candidates.length
      )
    ];

  usedQuestions.add(index);

  return questions[index];

}


/* =========================
   EVENTS
========================= */

const events = [

  {
    type:"short",
    text:"⚡ 3초 준다!",
    limit:3,
    bonus:1
  },

  {
    type:"long",
    text:"🐢 7초 준다!",
    limit:7,
    bonus:1
  },

  {
    type:"double",
    text:"💰 DOUBLE POINT!",
    limit:5,
    bonus:2
  },

  {
    type:"random",
    text:"🎲 RANDOM DIFFICULTY",
    limit:5,
    bonus:1
  },

  {
    type:"normal",
    text:"🔥 NORMAL ROUND",
    limit:5,
    bonus:1
  }

];


function chooseEvent(){

  currentEvent = null;

  if(Math.random() < 0.25){

    currentEvent =
      events[
        Math.floor(
          Math.random()*events.length
        )
      ];

  }

  if(currentEvent){

    currentLimit =
      currentEvent.limit;

    eventText.textContent =
      currentEvent.text;

    if(
      currentEvent.type === "short"
    ){

      eventText.className =
        "event hot";

    }
    else if(
      currentEvent.type === "double"
    ){

      eventText.className =
        "event good";

    }
    else{

      eventText.className =
        "event";

    }

  }
  else{

    currentLimit = 5;

    eventText.textContent =
      "NORMAL";

    eventText.className =
      "event";

  }

}


/* =========================
   PLAYER UI
========================= */

function updatePlayers(){

  for(let i=0;i<2;i++){

    document.getElementById(
      "score"+i
    ).textContent =
      scores[i];

    document.getElementById(
      "combo"+i
    ).textContent =
      combos[i];

    document.getElementById(
      "success"+i
    ).textContent =
      successCounts[i];

    playerCards[i]
      .classList
      .toggle(
        "active",
        i === currentPlayer
      );

  }

}


function updateRoundUI(){

  roundText.textContent =
    `ROUND ${currentRound + 1} / 100`;

  turnText.textContent =
    `PLAYER ${currentPlayer + 1}의 차례`;

  updatePlayers();

}


/* =========================
   COUNTDOWN
========================= */

function startCountdown(){

  let count = 3;

  countdownEl.classList.add("show");

  countNumber.textContent =
    count;

  const interval =
    setInterval(() => {

      count--;

      if(count <= 0){

        clearInterval(interval);

        countdownEl.classList.remove("show");

        beginRound();

        return;

      }

      countNumber.textContent =
        count;

      countNumber.style.animation =
        "none";

      void countNumber.offsetWidth;

      countNumber.style.animation =
        "";

    },1000);

}


/* =========================
   START
========================= */

startBtn.addEventListener(
  "click",
  () => {

    if(
      running ||
      waitingForResult
    ){
      return;
    }

    if(currentRound >= 100){

      finishGame();

      return;

    }

    startBtn.disabled = true;

    questionEl.textContent = "";

    questionEl.classList.add(
      "hidden"
    );

    resultButtons.classList.add(
      "hidden"
    );

    statusEl.textContent =
      "준비하세요...";

    chooseEvent();

    startCountdown();

  }
);


/* =========================
   BEGIN ROUND
========================= */

function beginRound(){

  currentQuestion =
    getQuestion();

  if(!currentQuestion){

    finishGame();

    return;

  }

  /*
    카운트다운이 끝난 직후
    질문 공개
  */

  questionEl.textContent =
    currentQuestion;

  questionEl.classList.remove(
    "hidden"
  );

  running = true;

  waitingForResult = false;

  timerStart =
    performance.now();

  timerEl.classList.remove(
    "warning"
  );

  statusEl.textContent =
    `${currentLimit}초 동안 답하세요!`;

  beep(700,0.08);

  updateTimer();

}


/* =========================
   TIMER
========================= */

function updateTimer(){

  if(!running) return;

  const elapsed =
    (
      performance.now() -
      timerStart
    ) / 1000;

  const remain =
    Math.max(
      0,
      currentLimit - elapsed
    );

  timerEl.textContent =
    remain.toFixed(2);

  const percent =
    remain / currentLimit;

  ringEl.style.background =
    `conic-gradient(
      #72a7ff ${percent*360}deg,
      #202945 0deg
    )`;

  if(remain <= 1){

    timerEl.classList.add(
      "warning"
    );

  }

  /*
    여기서는 시간이 끝났다고
    성공/실패를 자동 판정하지 않는다.
  */

  if(remain <= 0){

    timerEl.textContent =
      "0.00";

    timerFinished();

    return;

  }

  animationFrame =
    requestAnimationFrame(
      updateTimer
    );

}


/* =========================
   TIMER FINISHED
========================= */

function timerFinished(){

  if(!running) return;

  running = false;

  cancelAnimationFrame(
    animationFrame
  );

  timerEl.textContent =
    "0.00";

  timerEl.classList.remove(
    "warning"
  );

  ringEl.style.background =
    "conic-gradient(#ffb84d 0deg,#202945 0deg)";

  waitingForResult = true;

  /*
    여기서부터 인간이 판정
  */

  resultButtons.classList.remove(
    "hidden"
  );

  startBtn.disabled = true;

  statusEl.textContent =
    "시간 종료! 실제 결과를 선택하세요.";

  showAnnounce(
    "TIME UP",
    "#ffb84d"
  );

  beep(300,0.2);

}


/* =========================
   HUMAN SUCCESS
========================= */

successBtn.addEventListener(
  "click",
  () => {

    if(!waitingForResult){
      return;
    }

    processResult(true);

  }
);


/* =========================
   HUMAN FAIL
========================= */

failBtn.addEventListener(
  "click",
  () => {

    if(!waitingForResult){
      return;
    }

    processResult(false);

  }
);


/* =========================
   PROCESS RESULT
========================= */

function processResult(success){

  waitingForResult = false;

  resultButtons.classList.add(
    "hidden"
  );

  /*
    평균 시간에는 실제 제한시간을 사용
    (시간이 끝난 뒤 판정하는 방식이므로)
  */

  totalTimes[currentPlayer] +=
    currentLimit;

  if(success){

    successCounts[currentPlayer]++;

    combos[currentPlayer]++;

    bestCombos[currentPlayer] =
      Math.max(
        bestCombos[currentPlayer],
        combos[currentPlayer]
      );

    const point =
      currentEvent &&
      currentEvent.bonus === 2
        ? 2
        : 1;

    scores[currentPlayer] +=
      point;

    showAnnounce(
      point === 2
        ? "SUCCESS +2"
        : "SUCCESS",
      "#63e6a5"
    );

    gameCard.classList.add(
      "flash"
    );

    createParticles();

    setTimeout(() => {

      gameCard.classList.remove(
        "flash"
      );

    },450);

    if(
      combos[currentPlayer] >= 2
    ){

      setTimeout(() => {

        showAnnounce(
          `${combos[currentPlayer]} COMBO!`,
          "#ffd166"
        );

      },500);

    }

    beep(1000,0.12);

  }
  else{

    failCounts[currentPlayer]++;

    combos[currentPlayer] = 0;

    showAnnounce(
      "FAIL",
      "#ff626f"
    );

    gameCard.classList.add(
      "shake"
    );

    setTimeout(() => {

      gameCard.classList.remove(
        "shake"
      );

    },450);

    beep(180,0.25);

  }

  updatePlayers();

  setTimeout(
    nextRound,
    900
  );

}


/* =========================
   NEXT ROUND
========================= */

function nextRound(){

  currentRound++;

  if(currentRound >= 100){

    finishGame();

    return;

  }

  /*
    P1 → P2 → P1 → P2
  */

  currentPlayer =
    currentRound % 2;

  questionEl.textContent =
    "";

  questionEl.classList.add(
    "hidden"
  );

  timerEl.textContent =
    "5.00";

  ringEl.style.background =
    "conic-gradient(#72a7ff 360deg,#202945 0deg)";

  eventText.textContent =
    "READY";

  eventText.className =
    "event";

  startBtn.disabled = false;

  waitingForResult = false;

  statusEl.textContent =
    "도전 시작을 누르세요.";

  updateRoundUI();

}


/* =========================
   ANNOUNCE
========================= */

function showAnnounce(
  text,
  color
){

  announceText.textContent =
    text;

  announceText.style.color =
    color;

  announceEl.classList.add(
    "show"
  );

  setTimeout(() => {

    announceEl.classList.remove(
      "show"
    );

  },700);

}


/* =========================
   PARTICLES
========================= */

function createParticles(){

  for(let i=0;i<30;i++){

    const p =
      document.createElement(
        "div"
      );

    p.className =
      "particle";

    p.style.left =
      "50%";

    p.style.top =
      "50%";

    p.style.setProperty(
      "--x",
      `${Math.random()*500-250}px`
    );

    p.style.setProperty(
      "--y",
      `${Math.random()*500-250}px`
    );

    document
      .getElementById("particles")
      .appendChild(p);

    setTimeout(
      () => p.remove(),
      850
    );

  }

}


/* =========================
   FINAL
========================= */

function finishGame(){

  running = false;

  waitingForResult = false;

  cancelAnimationFrame(
    animationFrame
  );

  startBtn.disabled = true;

  resultButtons.classList.add(
    "hidden"
  );

  for(let i=0;i<2;i++){

    document.getElementById(
      "finalScore"+i
    ).textContent =
      `${scores[i]} POINT`;

    document.getElementById(
      "finalSuccess"+i
    ).textContent =
      successCounts[i];

    document.getElementById(
      "finalFail"+i
    ).textContent =
      failCounts[i];

    document.getElementById(
      "finalBest"+i
    ).textContent =
      bestCombos[i];

    const rounds =
      successCounts[i] +
      failCounts[i];

    const avg =
      rounds > 0
        ? totalTimes[i] / rounds
        : 0;

    document.getElementById(
      "finalAvg"+i
    ).textContent =
      `${avg.toFixed(2)}초`;

  }

  if(scores[0] > scores[1]){

    document.getElementById(
      "resultMessage"
    ).textContent =
      "PLAYER 1이 더 많은 점수를 기록했습니다!";

  }
  else if(scores[1] > scores[0]){

    document.getElementById(
      "resultMessage"
    ).textContent =
      "PLAYER 2가 더 많은 점수를 기록했습니다!";

  }
  else{

    document.getElementById(
      "resultMessage"
    ).textContent =
      "DRAW — 두 플레이어의 점수가 같습니다!";

  }

  setTimeout(() => {

    document
      .getElementById("endScreen")
      .classList.add("show");

  },500);

}


/* =========================
   SOUND
========================= */

let audioCtx = null;

function beep(
  freq,
  duration
){

  try{

    if(!audioCtx){

      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    const osc =
      audioCtx.createOscillator();

    const gain =
      audioCtx.createGain();

    osc.frequency.value =
      freq;

    osc.type =
      "sine";

    gain.gain.setValueAtTime(
      0.06,
      audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioCtx.currentTime +
      duration
    );

    osc.connect(gain);

    gain.connect(
      audioCtx.destination
    );

    osc.start();

    osc.stop(
      audioCtx.currentTime +
      duration
    );

  }
  catch(e){}

}


/* =========================
   INITIAL
========================= */

updateRoundUI();
